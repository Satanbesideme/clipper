name: Build installer Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # downloads from earlier builds, used when GitHub's download server times out (504)
      - uses: actions/cache@v4
        with:
          path: |
            deps-cache
            ~\AppData\Local\tauri
          key: deps-win-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: deps-win-

      - name: Unduh FFmpeg (build GPL dengan NVENC, QSV, AMF)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force deps-cache | Out-Null
          function Get-File($url, $tries) {
            for ($i = 1; $i -le $tries; $i++) {
              try { Invoke-WebRequest $url -OutFile ffmpeg-new.zip; return $true } catch { Write-Host "Unduh gagal ($i) $url : $($_.Exception.Message)"; Start-Sleep -Seconds (10 * $i) }
            }
            return $false
          }
          # 1) BtbN "latest"  2) the newest dated BtbN build  3) gyan.dev  4) the copy from an earlier build
          $urls = @("https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip")
          try {
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "galsurku-clipper-ci" }
            $rels = Invoke-RestMethod "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases?per_page=5" -Headers $headers
            foreach ($r in $rels) {
              if ($r.tag_name -eq 'latest') { continue }
              $a = $r.assets | Where-Object { $_.name -match '^ffmpeg-N-.*-win64-gpl\.zip$' } | Select-Object -First 1
              if ($a) { $urls += $a.browser_download_url; break }
            }
          } catch { Write-Host "Daftar rilis BtbN tidak bisa dibaca: $($_.Exception.Message)" }
          $urls += "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $ok = $false
          foreach ($u in $urls) { if (Get-File $u 3) { Write-Host "FFmpeg dari $u"; $ok = $true; break } }
          if ($ok) { Move-Item -Force ffmpeg-new.zip deps-cache/ffmpeg.zip }
          elseif (Test-Path deps-cache/ffmpeg.zip) { Write-Host "::warning::Pakai FFmpeg dari build sebelumnya" }
          else { throw "FFmpeg tidak bisa diunduh" }
          Copy-Item deps-cache/ffmpeg.zip ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe

      - name: Unduh whisper.cpp (subtitle otomatis)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "galsurku-clipper-ci" }
          $releases = Invoke-RestMethod "https://api.github.com/repos/ggml-org/whisper.cpp/releases?per_page=15" -Headers $headers -MaximumRetryCount 6 -RetryIntervalSec 20
          $asset = $null
          foreach ($r in $releases) {
            $asset = $r.assets | Where-Object { $_.name -match '^whisper-bin-x64.*\.zip$' } | Select-Object -First 1
            if (-not $asset) { $asset = $r.assets | Where-Object { $_.name -match 'bin-x64.*\.zip$' -and $_.name -notmatch 'blas|cublas|cuda|vulkan|openvino|sycl' } | Select-Object -First 1 }
            if ($asset) { Write-Host "Pakai $($asset.name) dari $($r.tag_name)"; break }
          }
          if (-not $asset) {
            $releases | ForEach-Object { Write-Host $_.tag_name; $_.assets | ForEach-Object { Write-Host "  $($_.name)" } }
            throw "Build Windows whisper.cpp tidak ditemukan"
          }
          $ok = $false
          for ($i = 1; $i -le 8 -and -not $ok; $i++) {
            try { Invoke-WebRequest $asset.browser_download_url -OutFile whisper-new.zip; $ok = $true } catch { Write-Host "Unduh gagal ($i): $($_.Exception.Message)"; Start-Sleep -Seconds (15 * $i) }
          }
          if ($ok) { Move-Item -Force whisper-new.zip deps-cache/whisper.zip }
          elseif (Test-Path deps-cache/whisper.zip) { Write-Host "::warning::Pakai whisper dari build sebelumnya" }
          else { throw "whisper tidak bisa diunduh" }
          Copy-Item deps-cache/whisper.zip whisper.zip
          Expand-Archive whisper.zip -DestinationPath whisper-tmp
          $cli = Get-ChildItem whisper-tmp -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $cli) { Get-ChildItem whisper-tmp -Recurse | ForEach-Object { Write-Host $_.FullName }; throw "whisper-cli.exe tidak ada di zip" }
          New-Item -ItemType Directory -Force src-tauri/whisper | Out-Null
          Copy-Item (Join-Path $cli.DirectoryName "*.exe") src-tauri/whisper/
          Copy-Item (Join-Path $cli.DirectoryName "*.dll") src-tauri/whisper/
          Get-ChildItem src-tauri/whisper

      - run: npm install

      - run: npx tauri icon app-icon.png

      # the bundler downloads NSIS from GitHub; try again when GitHub answers 504
      - name: npx tauri build
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npx tauri build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Build gagal (percobaan $i), coba lagi..."
            Start-Sleep -Seconds 30
          }
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Terbitkan installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.14.0-${{ github.run_number }}
          name: Gals Clip Studio 0.14.0 (build ${{ github.run_number }})
          files: src-tauri/target/release/bundle/nsis/*.exe
