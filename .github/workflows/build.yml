name: Build installer Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Unduh FFmpeg (build GPL dengan NVENC, QSV, AMF)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe

      - name: Unduh whisper.cpp (subtitle otomatis)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "galsurku-clipper-ci" }
          $releases = Invoke-RestMethod "https://api.github.com/repos/ggml-org/whisper.cpp/releases?per_page=15" -Headers $headers
          $asset = $null
          foreach ($r in $releases) {
            $asset = $r.assets | Where-Object { $_.name -match '^whisper-bin-x64.*\.zip$' } | Select-Object -First 1
            if (-not $asset) { $asset = $r.assets | Where-Object { $_.name -match 'bin-x64.*\.zip$' -and $_.name -notmatch 'blas|cublas|cuda|vulkan|openvino|sycl' } | Select-Object -First 1 }
            if ($asset) { Write-Host "Pakai $($asset.name) dari $($r.tag_name)"; break }
          }
          if (-not $asset) {
            $releases | ForEach-Object { Write-Host $_.tag_name; $_.assets | ForEach-Object { Write-Host "  $($_.name)" } }
            throw "Build Windows whisper.cpp tidak ditemukan"
          }
          Invoke-WebRequest $asset.browser_download_url -OutFile whisper.zip
          Expand-Archive whisper.zip -DestinationPath whisper-tmp
          $cli = Get-ChildItem whisper-tmp -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $cli) { Get-ChildItem whisper-tmp -Recurse | ForEach-Object { Write-Host $_.FullName }; throw "whisper-cli.exe tidak ada di zip" }
          New-Item -ItemType Directory -Force src-tauri/whisper | Out-Null
          Copy-Item (Join-Path $cli.DirectoryName "*.exe") src-tauri/whisper/
          Copy-Item (Join-Path $cli.DirectoryName "*.dll") src-tauri/whisper/
          Get-ChildItem src-tauri/whisper

      - run: npm install

      - run: npx tauri icon app-icon.png

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Terbitkan installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0-${{ github.run_number }}
          name: GALSURKU Clipper 0.6.0 (build ${{ github.run_number }})
          files: src-tauri/target/release/bundle/nsis/*.exe
